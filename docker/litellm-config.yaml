# Provider credentials are intentionally absent. Platform API invokes approved providers
# through its governed executor, resolving each credential from OpenBao at request time.
# LiteLLM remains an internal virtual-key gateway for isolated workspaces only.
model_list: []

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
