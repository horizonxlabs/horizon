services:
  openbao:
    image: openbao/openbao:2.3.1
    # Run `bao` directly (overriding the image entrypoint) so the server runs as root and can
    # write the root-owned /openbao/data volume — the image's default entrypoint drops to the
    # non-root `openbao` user, which cannot create /openbao/data/core (matches the dev stack,
    # which also overrides the entrypoint). OpenBao is internal-only (no published ports).
    entrypoint: ["bao"]
    command: ["server", "-config=/openbao/config/config.hcl"]
    cap_add:
      - IPC_LOCK
    volumes:
      # Mount the named volume at the path config.hcl actually stores to (/openbao/data),
      # otherwise OpenBao writes to the ephemeral container layer and loses secrets on recreate.
      - openbao-data:/openbao/data
    configs:
      - source: openbao-config
        target: /openbao/config/config.hcl
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  platform-api:
    environment:
      # Fixed internal values (hardcoded, NOT ${VAR:-default}) so the swarm contract test,
      # which parses raw YAML without interpolation, sees the literal expected values.
      VAULT_ADDR: http://openbao:8200
      VAULT_KV_MOUNT: platform
      VAULT_TOKEN_FILE: /run/evcp/openbao-token
    # The OpenBao workload token is minted AFTER OpenBao is running (post-deploy), so it cannot
    # be a pre-declared immutable Docker secret. It is delivered as a bind-mounted manager file
    # that bootstrap-swarm.sh writes (placeholder before deploy, real token after init) and then
    # `docker service update --force`s platform-api to re-read. platform-api is manager-pinned,
    # so the node-local bind mount is always present.
    volumes:
      - type: bind
        source: ${OPENBAO_TOKEN_FILE_HOST:?OPENBAO_TOKEN_FILE_HOST required (bootstrap-swarm.sh sets it)}
        target: /run/evcp/openbao-token
        read_only: true

configs:
  openbao-config:
    file: ./openbao/config.hcl

volumes:
  openbao-data:

# NOTE: no top-level `networks:` here. This overlay is only ever deployed together with
# docker-compose.release.yml (`docker stack deploy -c release -c openbao evcp`), which
# defines `evcp-internal` as an attachable overlay. Redeclaring it here as `external`
# clobbers that definition in the merge and makes `docker stack deploy` fail with
# "network ... is declared as external, but could not be found". The openbao service's
# `networks: [evcp-internal]` reference resolves against the release file's definition.
