name: evcp-private-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: evcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - evcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcp} -d ${POSTGRES_DB:-evcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  redis:
    image: redis:7-alpine
    container_name: evcp-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: evcp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - evcp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: evcp-keycloak
    restart: unless-stopped
    command: start --import-realm --http-enabled=true --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
    volumes:
      - ../apps/platform-api/keycloak/evcp-realm.json:/opt/keycloak/data/import/evcp-realm.json:ro
    networks:
      - evcp-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.2
    container_name: evcp-keycloak-bootstrap
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID:?KEYCLOAK_PLATFORM_CLIENT_ID is required}
      KEYCLOAK_PLATFORM_CLIENT_SECRET: ${KEYCLOAK_PLATFORM_CLIENT_SECRET:?KEYCLOAK_PLATFORM_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?KEYCLOAK_ADMIN_CLIENT_ID is required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/${KEYCLOAK_REALM}}
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL:?EVCP_PUBLIC_API_URL is required}
      EVCP_ADMIN_WEB_URL: ${EVCP_ADMIN_WEB_URL:?EVCP_ADMIN_WEB_URL is required}
      EVCP_CREATOR_WEB_URL: ${EVCP_CREATOR_WEB_URL:?EVCP_CREATOR_WEB_URL is required}
      EVCP_STORE_WEB_URL: ${EVCP_STORE_WEB_URL:?EVCP_STORE_WEB_URL is required}
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/bootstrap-clients.sh"]
    volumes:
      - ../apps/platform-api/keycloak/bootstrap-clients.sh:/opt/keycloak/bootstrap/bootstrap-clients.sh:ro
    networks:
      - evcp-internal

  litellm-db-init:
    image: postgres:16-alpine
    container_name: evcp-litellm-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      [
        "sh",
        "-lc",
        'psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tc "SELECT 1 FROM pg_database WHERE datname = ''litellm''" | grep -q 1 || psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c ''CREATE DATABASE litellm'''
      ]
    networks:
      - evcp-internal

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: evcp-litellm
    restart: unless-stopped
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required, for example postgresql://evcp:password@postgres:5432/litellm}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required, for example postgresql://evcp:password@postgres:5432/litellm}
    command: ["--config", "/etc/litellm/litellm-config.yaml"]
    volumes:
      - ./litellm-config.yaml:/etc/litellm/litellm-config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.create_connection((''127.0.0.1'', 4000), 3); s.close()"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - evcp-internal

  workspace-next-image:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-workspace-next:${EVCP_VERSION:?EVCP_VERSION is required}
    container_name: evcp-workspace-next-image
    restart: "no"
    command: ["sh", "-lc", "echo workspace-next image available"]
    networks:
      - evcp-internal

  platform-api:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-platform-api:${EVCP_VERSION:?EVCP_VERSION is required}
    container_name: evcp-platform-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      EVCP_LITELLM_BASE_URL: http://litellm:4000
      EVCP_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      EVCP_WORKSPACE_SECRET_KEY: ${EVCP_WORKSPACE_SECRET_KEY:?EVCP_WORKSPACE_SECRET_KEY is required}
      EVCP_WORKSPACE_IMAGE: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-workspace-next:${EVCP_VERSION:?EVCP_VERSION is required}
      EVCP_TEMPLATE_DIR: /workspace/templates/nextjs-base
      EVCP_WORKSPACE_NETWORK: evcp-private-server_evcp-internal
      EVCP_WORKSPACE_REAL_ADAPTERS: "1"
      EVCP_PG_HOST: postgres
      EVCP_PG_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      EVCP_S3_HOST: minio
      EVCP_S3_PORT: "9000"
      EVCP_S3_SSL: "false"
      EVCP_S3_PUBLIC_URL: ${EVCP_S3_PUBLIC_URL:?EVCP_S3_PUBLIC_URL is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      EVCP_ALLOW_SIMULATE_LOGIN: "0"
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?KEYCLOAK_ISSUER_URL is required}
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/${KEYCLOAK_REALM}}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID:?KEYCLOAK_PLATFORM_CLIENT_ID is required}
      KEYCLOAK_PLATFORM_CLIENT_SECRET: ${KEYCLOAK_PLATFORM_CLIENT_SECRET:?KEYCLOAK_PLATFORM_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?KEYCLOAK_ADMIN_CLIENT_ID is required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL:?EVCP_PUBLIC_API_URL is required}
    depends_on:
      workspace-next-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    networks:
      - evcp-internal

  admin-web:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-admin-web:${EVCP_VERSION:?EVCP_VERSION is required}
    container_name: evcp-admin-web
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - evcp-internal

  creator-web:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-creator-web:${EVCP_VERSION:?EVCP_VERSION is required}
    container_name: evcp-creator-web
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - evcp-internal

  app-store-pwa:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-app-store-pwa:${EVCP_VERSION:?EVCP_VERSION is required}
    container_name: evcp-app-store-pwa
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - evcp-internal

  caddy:
    image: caddy:2.8-alpine
    container_name: evcp-caddy
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${EVCP_HTTP_PORT:-8080}:80"
      - "${EVCP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.release:/etc/caddy/Caddyfile:ro
      - evcp_caddy_data:/data
      - evcp_caddy_config:/config
    depends_on:
      - platform-api
      - admin-web
      - creator-web
      - app-store-pwa
    networks:
      - evcp-internal

volumes:
  evcp_postgres_data:
  evcp_minio_data:
  evcp_caddy_data:
  evcp_caddy_config:

networks:
  evcp-internal:
    driver: bridge
