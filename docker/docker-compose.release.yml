# No top-level `name:` — `docker stack config`/`docker stack deploy` reject it
# ("(root) Additional property name is not allowed"); the stack name is supplied
# on the CLI: `docker stack deploy ... evcp`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD_FILE: /run/secrets/evcp_postgres_password
    secrets:
      - evcp_postgres_password
    volumes:
      - evcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcp} -d ${POSTGRES_DB:-evcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/evcp_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/evcp_minio_root_password
    secrets:
      - evcp_minio_root_user
      - evcp_minio_root_password
    volumes:
      - evcp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  keycloak:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-keycloak:${EVCP_VERSION:?EVCP_VERSION required}
    entrypoint: ["/bin/sh", "/etc/evcp/secrets-entrypoint.sh"]
    command: /opt/keycloak/bin/kc.sh start --import-realm --http-enabled=true --http-port=8080 --proxy-headers=xforwarded --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/evcp_keycloak_admin_password
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-evcp}
      KC_DB_PASSWORD_FILE: /run/secrets/evcp_postgres_password
    secrets:
      - evcp_postgres_password
      - evcp_keycloak_admin_password
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/evcp-realm.json
      - source: secrets-entrypoint
        target: /etc/evcp/secrets-entrypoint.sh
    networks:
      - evcp-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  keycloak-db-init:
    image: postgres:16-alpine
    command:
      - sh
      - -lc
      - 'export PGPASSWORD=$$(cat /run/secrets/evcp_postgres_password); until pg_isready -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do sleep 2; done; psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tc "SELECT 1 FROM pg_database WHERE datname = ''keycloak''" | grep -q 1 || psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c ''CREATE DATABASE keycloak'''
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
    secrets:
      - evcp_postgres_password
    networks:
      - evcp-internal
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
      placement:
        constraints: ["node.role == manager"]

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Secrets delivered as files; the secrets-entrypoint shim exports <VAR> from <VAR>_FILE
      # before exec-ing bootstrap-clients.sh (which reads KC_BOOTSTRAP_ADMIN_PASSWORD and the
      # KEYCLOAK_*_CLIENT_SECRET vars).
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/evcp_keycloak_admin_password
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID:?KEYCLOAK_PLATFORM_CLIENT_ID is required}
      KEYCLOAK_PLATFORM_CLIENT_SECRET_FILE: /run/secrets/evcp_keycloak_platform_client_secret
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?KEYCLOAK_ADMIN_CLIENT_ID is required}
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/evcp_keycloak_admin_client_secret
      # NOTE: no nested ${KEYCLOAK_REALM} in this default — Docker interpolation closes the outer
      # ${...} at the first '}' and appends the second as a literal, producing ".../realms/evcp}".
      # bootstrap-swarm.sh (and .env) set KEYCLOAK_INTERNAL_ISSUER_URL explicitly for non-evcp realms.
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/evcp}
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL:?EVCP_PUBLIC_API_URL is required}
      EVCP_ADMIN_WEB_URL: ${EVCP_ADMIN_WEB_URL:?EVCP_ADMIN_WEB_URL is required}
      EVCP_CREATOR_WEB_URL: ${EVCP_CREATOR_WEB_URL:?EVCP_CREATOR_WEB_URL is required}
      EVCP_STORE_WEB_URL: ${EVCP_STORE_WEB_URL:?EVCP_STORE_WEB_URL is required}
    entrypoint: ["/bin/sh", "/etc/evcp/secrets-entrypoint.sh"]
    command: ["/bin/sh", "/opt/keycloak/bootstrap/bootstrap-clients.sh"]
    secrets:
      - evcp_keycloak_admin_password
      - evcp_keycloak_platform_client_secret
      - evcp_keycloak_admin_client_secret
    configs:
      - source: keycloak-bootstrap-script
        target: /opt/keycloak/bootstrap/bootstrap-clients.sh
      - source: secrets-entrypoint
        target: /etc/evcp/secrets-entrypoint.sh
    networks:
      - evcp-internal
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
      placement:
        constraints: ["node.role == manager"]

  litellm-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
    secrets:
      - evcp_postgres_password
    command:
      [
        "sh",
        "-lc",
        'export PGPASSWORD=$$(cat /run/secrets/evcp_postgres_password); until pg_isready -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do sleep 2; done; psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tc "SELECT 1 FROM pg_database WHERE datname = ''litellm''" | grep -q 1 || psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c ''CREATE DATABASE litellm'''
      ]
    networks:
      - evcp-internal
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
      placement:
        constraints: ["node.role == manager"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    entrypoint: ["/bin/sh", "/etc/evcp/secrets-entrypoint.sh"]
    environment:
      LITELLM_MASTER_KEY_FILE: /run/secrets/evcp_litellm_master_key
      DATABASE_URL_FILE: /run/secrets/evcp_litellm_database_url
      LITELLM_DATABASE_URL_FILE: /run/secrets/evcp_litellm_database_url
    command: litellm --config /etc/litellm/litellm-config.yaml
    secrets:
      - evcp_litellm_master_key
      - evcp_litellm_database_url
    configs:
      - source: litellm-config
        target: /etc/litellm/litellm-config.yaml
      - source: secrets-entrypoint
        target: /etc/evcp/secrets-entrypoint.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.create_connection((''127.0.0.1'', 4000), 3); s.close()"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  workspace-next-image:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY required}/evcp-workspace-next:${EVCP_VERSION:?EVCP_VERSION required}
    command: ["true"]
    networks: [evcp-internal]
    deploy:
      mode: replicated-job
      restart_policy:
        condition: none
      placement:
        constraints: ["node.role == manager"]

  platform-api:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-platform-api:${EVCP_VERSION:?EVCP_VERSION is required}
    # The image CMD runs `prisma migrate deploy` (which reads DATABASE_URL) BEFORE the Node app
    # and its in-app secret loader run, so the shim must export DATABASE_URL (and the other
    # *_FILE secrets) from the mounted files first, then exec the image CMD.
    entrypoint: ["/bin/sh", "/etc/evcp/secrets-entrypoint.sh"]
    # Overriding entrypoint drops the image CMD, so the shim would exec nothing — restate the
    # image's start command explicitly as args for the shim's `exec "$@"`.
    command:
      - sh
      - -lc
      - pnpm --filter @evcp/platform-api exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @evcp/platform-api seed && pnpm --filter @evcp/platform-api start
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mounts the host stack.env/domain.env directory so platform-api can durably persist a
      # UI-set domain (domain.env, written to the host so bootstrap-swarm.sh sources it on every
      # future deploy — see docs/superpowers/plans/2026-08-02-in-ui-domain.md).
      - type: bind
        source: ${EVCP_STACK_ENV_DIR:-/opt/evcp}
        target: /etc/evcp/host
    environment:
      # Where the host's stack.env/domain.env directory is bind-mounted (see volumes above).
      EVCP_STACK_ENV_DIR: /etc/evcp/host
      # The in-UI version updater needs the same release coordinates used to resolve this
      # service's image so it can report current state and construct the next image refs.
      EVCP_VERSION: ${EVCP_VERSION:?EVCP_VERSION required}
      EVCP_IMAGE_REPOSITORY: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY required}
      # DATABASE_URL carries the password, so it is delivered as a Docker secret (built by
      # bootstrap-swarm.sh from the postgres password) and exported by the shim above.
      DATABASE_URL_FILE: /run/secrets/evcp_database_url
      # Without this the app defaults to "legacy" (mock-first) persistence: real Postgres-backed
      # services (incl. first-time setup / business settings) never wire up and /setup/* 404s.
      EVCP_CORE_PERSISTENCE: ${EVCP_CORE_PERSISTENCE:-prisma}
      EVCP_LITELLM_BASE_URL: http://litellm:4000
      EVCP_LITELLM_MASTER_KEY_FILE: /run/secrets/evcp_litellm_master_key
      EVCP_WORKSPACE_SECRET_KEY_FILE: /run/secrets/evcp_workspace_secret_key
      EVCP_WORKSPACE_IMAGE: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY required}/evcp-workspace-next:${EVCP_VERSION:?EVCP_VERSION required}
      EVCP_TEMPLATE_DIR: /workspace/templates/nextjs-base
      EVCP_WORKSPACE_NETWORK: evcp_evcp-internal
      EVCP_WORKSPACE_REAL_ADAPTERS: "1"
      EVCP_PG_HOST: postgres
      EVCP_PG_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD_FILE: /run/secrets/evcp_postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      EVCP_S3_HOST: minio
      EVCP_S3_PORT: "9000"
      EVCP_S3_SSL: "false"
      # Swarm task container names are dynamic (evcp_minio.1.<task-id>). The Docker adapter
      # resolves the stable service label to the currently running task before executing `mc`.
      EVCP_MINIO_CONTAINER_NAME: evcp_minio
      EVCP_S3_PUBLIC_URL: ${EVCP_S3_PUBLIC_URL:?EVCP_S3_PUBLIC_URL required}
      EVCP_AI_JOB_ENCRYPTION_KEY_FILE: /run/secrets/evcp_ai_job_encryption_key
      EVCP_AI_COMPLETION_TIMEOUT_MS: ${EVCP_AI_COMPLETION_TIMEOUT_MS:-3000000}
      EVCP_PI_MAX_MODEL_ROUNDS: ${EVCP_PI_MAX_MODEL_ROUNDS:-12}
      EVCP_PI_MAX_TURN_TOKENS: ${EVCP_PI_MAX_TURN_TOKENS:-600000}
      EVCP_PI_MODEL_ROUND_TIMEOUT_MS: ${EVCP_PI_MODEL_ROUND_TIMEOUT_MS:-3000000}
      EVCP_PI_MAX_TOOL_CALLS: ${EVCP_PI_MAX_TOOL_CALLS:-40}
      EVCP_PI_SHELL_TIMEOUT_MS: ${EVCP_PI_SHELL_TIMEOUT_MS:-120000}
      EVCP_PI_MAX_TOOL_OUTPUT_BYTES: ${EVCP_PI_MAX_TOOL_OUTPUT_BYTES:-65536}
      EVCP_PI_MAX_FILE_BYTES: ${EVCP_PI_MAX_FILE_BYTES:-120000}
      EVCP_PI_TURN_TIMEOUT_MS: ${EVCP_PI_TURN_TIMEOUT_MS:-600000}
      EVCP_PI_VALIDATION_RETRIES: ${EVCP_PI_VALIDATION_RETRIES:-2}
      MINIO_ROOT_USER_FILE: /run/secrets/evcp_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/evcp_minio_root_password
      EVCP_ALLOW_SIMULATE_LOGIN: "0"
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?KEYCLOAK_ISSUER_URL required}
      # NOTE: no nested ${KEYCLOAK_REALM} in this default — Docker interpolation closes the outer
      # ${...} at the first '}' and appends the second as a literal, producing ".../realms/evcp}".
      # bootstrap-swarm.sh (and .env) set KEYCLOAK_INTERNAL_ISSUER_URL explicitly for non-evcp realms.
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/evcp}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM required}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID:?KEYCLOAK_PLATFORM_CLIENT_ID required}
      KEYCLOAK_PLATFORM_CLIENT_SECRET_FILE: /run/secrets/evcp_keycloak_platform_client_secret
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?KEYCLOAK_ADMIN_CLIENT_ID required}
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/evcp_keycloak_admin_client_secret
      SESSION_SECRET_FILE: /run/secrets/evcp_session_secret
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL:?EVCP_PUBLIC_API_URL required}
      # Allowed OIDC returnTo origins for the three frontends — without these the app falls back
      # to dev defaults (localhost:4100/4101/4102) and every real login fails "invalid_return_to".
      EVCP_ADMIN_WEB_URL: ${EVCP_ADMIN_WEB_URL:?EVCP_ADMIN_WEB_URL required}
      EVCP_CREATOR_WEB_URL: ${EVCP_CREATOR_WEB_URL:?EVCP_CREATOR_WEB_URL required}
      EVCP_STORE_WEB_URL: ${EVCP_STORE_WEB_URL:?EVCP_STORE_WEB_URL required}
    secrets:
      - evcp_database_url
      - evcp_postgres_password
      - evcp_minio_root_user
      - evcp_minio_root_password
      - evcp_litellm_master_key
      - evcp_workspace_secret_key
      - evcp_ai_job_encryption_key
      - evcp_keycloak_platform_client_secret
      - evcp_keycloak_admin_client_secret
      - evcp_session_secret
    configs:
      - source: secrets-entrypoint
        target: /etc/evcp/secrets-entrypoint.sh
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  admin-web:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY is required}/evcp-admin-web:${EVCP_VERSION:?EVCP_VERSION required}
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  creator-web:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY required}/evcp-creator-web:${EVCP_VERSION:?EVCP_VERSION required}
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  app-store-pwa:
    image: ${EVCP_IMAGE_REPOSITORY:?EVCP_IMAGE_REPOSITORY required}/evcp-app-store-pwa:${EVCP_VERSION:?EVCP_VERSION required}
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

  caddy:
    image: caddy:2.8-alpine
    # Caddyfile.release reads `{$EVCP_CADDY_ADDRESS}` from the CONTAINER environment (not a
    # compose interpolation), so it must be passed in here. IP-first bootstrap sets it to `:80`
    # (serve HTTP on all hosts, no TLS); a domain deploy sets it to the hostname (auto-HTTPS).
    environment:
      EVCP_CADDY_ADDRESS: ${EVCP_CADDY_ADDRESS:-localhost}
      EVCP_STORAGE_CADDY_ADDRESS: ${EVCP_STORAGE_CADDY_ADDRESS:-storage.localhost}
    ports:
      - "${EVCP_HTTP_PORT:-8080}:80"
      - "${EVCP_HTTPS_PORT:-8443}:443"
    configs:
      - source: caddyfile-release
        target: /etc/caddy/Caddyfile
    volumes:
      - evcp_caddy_data:/data
      - evcp_caddy_config:/config
    networks:
      - evcp-internal
    deploy:
      placement:
        constraints: ["node.role == manager"]
      restart_policy:
        condition: any

configs:
  litellm-config:
    name: evcp_litellm-config-${EVCP_VERSION:?EVCP_VERSION required}
    file: ./litellm-config.yaml
  caddyfile-release:
    name: evcp_caddyfile-release-${EVCP_VERSION:?EVCP_VERSION required}
    file: ./Caddyfile.release
  keycloak-realm:
    name: evcp_keycloak-realm-${EVCP_VERSION:?EVCP_VERSION required}
    file: ../apps/platform-api/keycloak/evcp-realm.json
  keycloak-bootstrap-script:
    name: evcp_keycloak-bootstrap-script-${EVCP_VERSION:?EVCP_VERSION required}
    file: ../apps/platform-api/keycloak/bootstrap-clients.sh
  secrets-entrypoint:
    name: evcp_secrets-entrypoint-${EVCP_VERSION:?EVCP_VERSION required}
    file: ./secrets-entrypoint.sh

secrets:
  evcp_database_url:
    external: true
  evcp_postgres_password:
    external: true
  evcp_minio_root_user:
    external: true
  evcp_minio_root_password:
    external: true
  evcp_litellm_master_key:
    external: true
  evcp_litellm_database_url:
    external: true
  evcp_workspace_secret_key:
    external: true
  evcp_ai_job_encryption_key:
    external: true
  evcp_keycloak_admin_password:
    external: true
  evcp_keycloak_platform_client_secret:
    external: true
  evcp_keycloak_admin_client_secret:
    external: true
  evcp_session_secret:
    external: true

volumes:
  evcp_postgres_data:
  evcp_minio_data:
  evcp_caddy_data:
  evcp_caddy_config:

networks:
  evcp-internal:
    driver: overlay
    attachable: true
