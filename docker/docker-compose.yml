services:
  postgres:
    image: postgres:16-alpine
    container_name: evcp-postgres
    environment:
      POSTGRES_DB: evcp
      POSTGRES_USER: evcp
      POSTGRES_PASSWORD: evcp
    ports:
      - "5432:5432"
    volumes:
      - evcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcp -d evcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evcp_postgres_data:
