name: evcp-private-server

x-evcp-node-service: &evcp-node-service
  image: node:22-alpine
  working_dir: /workspace
  volumes:
    - ..:/workspace
    - evcp_node_modules:/workspace/node_modules
    - evcp_pnpm_store:/workspace/.pnpm-store
  command: sh -lc "corepack enable && pnpm install --frozen-lockfile"

services:
  postgres:
    image: postgres:16-alpine
    container_name: evcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${EVCP_PG_HOST_PORT:-5432}:5432"
    volumes:
      - evcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcp} -d ${POSTGRES_DB:-evcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  redis:
    image: redis:7-alpine
    container_name: evcp-redis
    restart: unless-stopped
    ports:
      # Host port 6380 avoids colliding with an unrelated host Redis on 6379;
      # in-stack clients still reach it as redis:6379 over the internal network.
      - "${EVCP_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: evcp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${EVCP_S3_HOST_PORT:-9000}:9000"
      - "${EVCP_S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - evcp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - evcp-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: evcp-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
    ports:
      - "${EVCP_KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ../apps/platform-api/keycloak/evcp-realm.json:/opt/keycloak/data/import/evcp-realm.json:ro
      - ../apps/platform-api/keycloak/themes/horizon:/opt/keycloak/themes/horizon:ro
      # Persist Keycloak's H2 store so users provisioned at setup (the first admin — Keycloak
      # owns interactive sign-in) survive container recreation. Without this, recreating the
      # stack wipes the admin and locks everyone out. --import-realm skips the existing realm.
      - evcp_keycloak_data:/opt/keycloak/data
    networks:
      - evcp-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.2
    container_name: evcp-keycloak-bootstrap
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID:?KEYCLOAK_PLATFORM_CLIENT_ID is required}
      KEYCLOAK_PLATFORM_CLIENT_SECRET: ${KEYCLOAK_PLATFORM_CLIENT_SECRET:?KEYCLOAK_PLATFORM_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?KEYCLOAK_ADMIN_CLIENT_ID is required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/${KEYCLOAK_REALM}}
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL:?EVCP_PUBLIC_API_URL is required}
      EVCP_ADMIN_WEB_URL: ${EVCP_ADMIN_WEB_URL:-http://localhost:8088}
      EVCP_CREATOR_WEB_URL: ${EVCP_CREATOR_WEB_URL:-http://localhost:8088}
      EVCP_STORE_WEB_URL: ${EVCP_STORE_WEB_URL:-http://localhost:8088}
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/bootstrap-clients.sh"]
    volumes:
      - ../apps/platform-api/keycloak/bootstrap-clients.sh:/opt/keycloak/bootstrap/bootstrap-clients.sh:ro
    networks:
      - evcp-internal

  platform-api:
    <<: *evcp-node-service
    container_name: evcp-platform-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    command: sh -lc "printf 'dev-root-token' > /tmp/openbao-dev-token && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @evcp/platform-api exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @evcp/platform-api exec prisma generate --schema prisma/schema.prisma && pnpm --filter @evcp/platform-api seed && HOST=0.0.0.0 PORT=3100 pnpm --filter @evcp/platform-api dev"
    ports:
      - "${EVCP_API_PORT:-3100}:3100"
    volumes:
      - ..:/workspace
      - evcp_node_modules:/workspace/node_modules
      - evcp_pnpm_store:/workspace/.pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EVCP_APP_SUBDOMAIN_BASE_DOMAIN: ${EVCP_APP_SUBDOMAIN_BASE_DOMAIN:-localhost}
      EVCP_LITELLM_BASE_URL: http://litellm:4000
      EVCP_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EVCP_WORKSPACE_SECRET_KEY: ${EVCP_WORKSPACE_SECRET_KEY}
      EVCP_WORKSPACE_IMAGE: ${EVCP_WORKSPACE_IMAGE:-evcp/workspace-next:1}
      # 2 cores by default: next dev's cold compile is CPU-bound and painfully slow on 1.
      EVCP_WORKSPACE_CPU: ${EVCP_WORKSPACE_CPU:-2}
      EVCP_WORKSPACE_MEM_MB: ${EVCP_WORKSPACE_MEM_MB:-2048}
      EVCP_TEMPLATE_DIR: /workspace/templates/nextjs-base
      EVCP_WORKSPACE_NETWORK: evcp-internal
      EVCP_WORKSPACE_REAL_ADAPTERS: "1"
      EVCP_PG_HOST: postgres
      EVCP_PG_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      EVCP_S3_HOST: minio
      EVCP_S3_PORT: "9000"
      EVCP_S3_SSL: "false"
      EVCP_S3_PUBLIC_URL: ${EVCP_S3_PUBLIC_URL:-http://localhost:9000}
      EVCP_AI_JOB_ENCRYPTION_KEY: ${EVCP_AI_JOB_ENCRYPTION_KEY:-}
      # Per-completion abort timeout (ms). Generous default for slow local models — a hosted
      # provider needs far less. Override in .env for faster/slower providers.
      EVCP_AI_COMPLETION_TIMEOUT_MS: ${EVCP_AI_COMPLETION_TIMEOUT_MS:-3000000}
      EVCP_AI_IMAGE_TIMEOUT_MS: ${EVCP_AI_IMAGE_TIMEOUT_MS:-60000}
      EVCP_PI_MAX_MODEL_ROUNDS: ${EVCP_PI_MAX_MODEL_ROUNDS:-20}
      EVCP_PI_MODEL_ROUND_TIMEOUT_MS: ${EVCP_PI_MODEL_ROUND_TIMEOUT_MS:-3000000}
      EVCP_PI_MAX_TOOL_CALLS: ${EVCP_PI_MAX_TOOL_CALLS:-40}
      EVCP_PI_MAX_IMAGE_CALLS: ${EVCP_PI_MAX_IMAGE_CALLS:-4}
      EVCP_PI_IMAGE_MAX_BYTES: ${EVCP_PI_IMAGE_MAX_BYTES:-4194304}
      EVCP_PI_SHELL_TIMEOUT_MS: ${EVCP_PI_SHELL_TIMEOUT_MS:-120000}
      EVCP_PI_MAX_TOOL_OUTPUT_BYTES: ${EVCP_PI_MAX_TOOL_OUTPUT_BYTES:-65536}
      EVCP_PI_MAX_FILE_BYTES: ${EVCP_PI_MAX_FILE_BYTES:-120000}
      EVCP_PI_TURN_TIMEOUT_MS: ${EVCP_PI_TURN_TIMEOUT_MS:-1800000}
      EVCP_PI_VALIDATION_RETRIES: ${EVCP_PI_VALIDATION_RETRIES:-2}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      EVCP_ALLOW_SIMULATE_LOGIN: "0"
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/${KEYCLOAK_REALM}}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_PLATFORM_CLIENT_ID: ${KEYCLOAK_PLATFORM_CLIENT_ID}
      KEYCLOAK_PLATFORM_CLIENT_SECRET: ${KEYCLOAK_PLATFORM_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      EVCP_PUBLIC_API_URL: ${EVCP_PUBLIC_API_URL}
      # AI provider secret store — dev-mode OpenBao (see the `openbao` service below).
      # `server -dev` only auto-mounts the default `secret/` KV v2 engine, so point at it
      # (production provisions a `platform/` mount separately). The token file is written
      # into the container by this service's command from the dev root token.
      VAULT_ADDR: http://openbao:8200
      VAULT_KV_MOUNT: secret
      VAULT_TOKEN_FILE: /tmp/openbao-dev-token
    networks:
      - evcp-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_healthy
      openbao:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully

  admin-web:
    <<: *evcp-node-service
    container_name: evcp-admin-web
    restart: unless-stopped
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @evcp/admin-web exec vite --host 0.0.0.0 --port 4100"
    ports:
      - "${EVCP_ADMIN_PORT:-4100}:4100"
    depends_on:
      - platform-api
    networks:
      - evcp-internal
  creator-web:
    <<: *evcp-node-service
    container_name: evcp-creator-web
    restart: unless-stopped
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @evcp/creator-web exec vite --host 0.0.0.0 --port 4101"
    ports:
      - "${EVCP_CREATOR_PORT:-4101}:4101"
    depends_on:
      - platform-api
    networks:
      - evcp-internal
  app-store-pwa:
    <<: *evcp-node-service
    container_name: evcp-app-store-pwa
    restart: unless-stopped
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @evcp/app-store-pwa exec vite --host 0.0.0.0 --port 4102"
    ports:
      - "${EVCP_STORE_PORT:-4102}:4102"
    depends_on:
      - platform-api
    networks:
      - evcp-internal
  caddy:
    image: caddy:2.8-alpine
    container_name: evcp-caddy
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${EVCP_HTTP_PORT:-8080}:80"
      - "${EVCP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - evcp_caddy_data:/data
      - evcp_caddy_config:/config
    depends_on:
      - platform-api
      - admin-web
      - creator-web
      - app-store-pwa
    networks:
      - evcp-internal

  litellm-db-init:
    image: postgres:16-alpine
    container_name: evcp-litellm-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcp}
      POSTGRES_DB: ${POSTGRES_DB:-evcp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      [
        "sh",
        "-lc",
        'psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tc "SELECT 1 FROM pg_database WHERE datname = ''litellm''" | grep -q 1 || psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c ''CREATE DATABASE litellm'''
      ]
    networks:
      - evcp-internal

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: evcp-litellm
    restart: unless-stopped
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required}
    command: ["--config", "/etc/litellm/litellm-config.yaml"]
    volumes:
      - ./litellm-config.yaml:/etc/litellm/litellm-config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.create_connection((''127.0.0.1'', 4000), 3); s.close()"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - evcp-internal

  # Dev-mode secret store for the AI Providers console. Ephemeral (in-memory), auto-unsealed,
  # fixed root token — dev only. The production/persistent OpenBao lives in
  # docker/docker-compose.openbao.yml (manual init + unseal), used by the release stack.
  openbao:
    image: openbao/openbao:2.3.1
    container_name: evcp-openbao
    restart: unless-stopped
    # Runs on file storage (volume) instead of `server -dev` so AI provider secrets survive a stack
    # recreate. The entrypoint initializes + unseals once and mints a fixed `dev-root-token`.
    user: "0:0"
    cap_add:
      - IPC_LOCK
    entrypoint: ["/bin/sh", "/openbao/config/entrypoint.sh"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/entrypoint.sh:/openbao/config/entrypoint.sh:ro
      - evcp_openbao_data:/openbao/data
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - evcp-internal

volumes:
  evcp_postgres_data:
  evcp_minio_data:
  evcp_keycloak_data:
  evcp_openbao_data:
  evcp_caddy_data:
  evcp_caddy_config:
  evcp_node_modules:
  evcp_pnpm_store:

networks:
  evcp-internal:
    # Pin the real network name so it does not depend on the Compose project name. Per-project
    # workspace containers are attached to EVCP_WORKSPACE_NETWORK by the orchestrator and must
    # land on this same network to be reachable by the Platform API preview proxy.
    name: evcp-internal
    driver: bridge
