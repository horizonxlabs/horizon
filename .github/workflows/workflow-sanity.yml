name: Workflow Sanity

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fail on tabs in workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          bad = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              if b"\t" in path.read_bytes():
                  bad.append(str(path))

          if bad:
              print("Tabs found in workflow files:")
              for path in bad:
                  print(f"- {path}")
              sys.exit(1)
          PY

      - name: Install actionlint
        run: |
          set -euo pipefail
          version="1.7.10"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint
