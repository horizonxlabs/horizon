name: Workflow Sanity

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-sanity:
    # See the CI_RUNNER_LABELS note in ci.yml; the same repository variable drives both.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux"]') }}
    timeout-minutes: 10
    steps:
      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          missing=""
          for tool in curl tar sha256sum; do
            command -v "${tool}" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -n "${missing}" ]; then
            echo "Runner is missing required tooling:${missing}" >&2
            echo "See docs/operations/self-hosted-runners.md for the required host packages." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fail on tabs in workflows
        run: |
          set -euo pipefail
          # Implemented in shell rather than python3: GitHub-hosted images ship Python, but a
          # self-hosted runner host only has what its operator installed.
          if matches=$(grep -lF "$(printf '\t')" .github/workflows/*.yml); then
            echo "Tabs found in workflow files:" >&2
            while IFS= read -r file; do
              echo "- ${file}" >&2
            done <<<"${matches}"
            exit 1
          fi

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          set -euo pipefail
          # actionlint shells out to shellcheck to lint every `run:` block, and silently skips
          # that entire class of check when shellcheck is not on PATH. The failure mode is not a
          # red build but a green one quietly checking less than it did on GitHub-hosted
          # runners, so shellcheck is installed here rather than assumed to exist on the host.
          # The .tar.gz assets are used deliberately over the .tar.xz ones: xz is not present on
          # every minimal Linux image, and gzip is.
          #
          # Upstream publishes no checksums file for these assets, so the digests are pinned
          # below. Regenerate them when SHELLCHECK_VERSION changes.
          case "$(uname -m)" in
            x86_64)
              arch="x86_64"
              sha="b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
              ;;
            aarch64 | arm64)
              arch="aarch64"
              sha="68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc"
              ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.gz"
          cd "${RUNNER_TEMP}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${sha}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod 0755 "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.10"
        run: |
          set -euo pipefail
          # Two self-hosted adjustments versus the GitHub-hosted original: the architecture is
          # detected rather than assumed to be amd64, and the binary is unpacked into the
          # per-job temp directory instead of being `sudo install`-ed into /usr/local/bin.
          # Passwordless sudo is not guaranteed on a self-hosted host, and writing there would
          # leave state behind on a machine shared with every other job.
          case "$(uname -m)" in
            x86_64) arch="amd64" ;;
            aarch64 | arm64) arch="arm64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          cd "${RUNNER_TEMP}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "${archive}" \
            "${base}/${archive}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o checksums.txt \
            "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" actionlint
          chmod 0755 "${RUNNER_TEMP}/bin/actionlint"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Lint workflows
        run: |
          set -euo pipefail
          # Guard against the silent-skip: if shellcheck is not resolvable at this point,
          # actionlint would still exit 0 having linted no shell at all.
          command -v shellcheck >/dev/null || { echo "shellcheck not on PATH" >&2; exit 1; }
          actionlint
