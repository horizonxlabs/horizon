name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Runs on the organisation's self-hosted Linux runners. `self-hosted` and `linux` are labels
    # GitHub applies automatically, so no custom label has to be configured on the runner host.
    # The CI_RUNNER_LABELS repository variable overrides the set as a JSON array — set it to
    # `["ubuntu-latest"]` from the repository settings to fall back to GitHub-hosted runners
    # while the fleet is down, without editing this file.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Changed-file quality gate
        if: github.event_name == 'pull_request'
        run: pnpm check:changed --base origin/${{ github.base_ref }}

      - name: Full quality gate
        run: pnpm check:ci
