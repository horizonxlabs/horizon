name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Runs on the organisation's self-hosted Linux runners. `self-hosted` and `linux` are labels
    # GitHub applies automatically, so no custom label has to be configured on the runner host.
    # The CI_RUNNER_LABELS repository variable overrides the set as a JSON array — set it to
    # `["ubuntu-latest"]` from the repository settings to fall back to GitHub-hosted runners
    # while the fleet is down, without editing this file.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm is installed *after* Node so that setup-node's Node lands on PATH first. The
      # self-hosted runner host carries an ancient node (pre-`node:` protocol) on PATH, and
      # pnpm/action-setup's self-installer ran under it and died with
      # "Cannot find module 'node:path'". Ordering is the fix; do not swap these back.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Replaces setup-node's `cache: pnpm`, which can no longer be used: that option resolves
      # the store via `pnpm store path` and so requires pnpm to already be installed, which is
      # exactly what the ordering above rules out.
      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Changed-file quality gate
        if: github.event_name == 'pull_request'
        run: pnpm check:changed --base origin/${{ github.base_ref }}

      - name: Full quality gate
        run: pnpm check:ci
