<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Horizon Store</title>
    <style>
      body {
        align-items: center;
        background: #eef3f8;
        color: #0f172a;
        display: grid;
        font-family: Inter, system-ui, sans-serif;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #d7deea;
        border-radius: 8px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        max-width: 420px;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      p {
        color: #64748b;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>Horizon Store is unavailable right now. Reconnect to your private server and try again.</p>
    </main>
  </body>
</html>
